services:
  # Django Web Service
  - type: web
    name: erp-backend
    env: python
    plan: free
    region: oregon
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "python manage.py migrate --no-input && gunicorn erp_core.wsgi:application --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: erp-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: RENDER_EXTERNAL_HOSTNAME
        value: "erp-backend-a37b.onrender.com"
      - key: USE_S3
        value: "False"
    healthCheckPath: /api/health/

databases:
  # PostgreSQL Database gestionada por Render
  - name: erp-postgres
    plan: free
    region: oregon
    databaseName: erpmanufactura
    user: erpmanufactura_user
