services:
  # Base de Datos PostgreSQL
  - type: database
    name: erp-db-7798
    databaseName: erp_8amperios
    user: erp_admin
    plan: free

  # Backend - Django Web Service
  - type: web
    name: erp-backend-7798
    runtime: python
    plan: free
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn erp_core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db-7798
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "erp-backend-7798.onrender.com,.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://erp-frontend-7798.onrender.com,https://erp-backend-7798.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://erp-frontend-7798.onrender.com,https://erp-backend-7798.onrender.com,https://*.onrender.com"

  # Frontend - React Static Site
  - type: static
    name: erp-frontend-7798
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: https://erp-backend-7798.onrender.com/api
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"