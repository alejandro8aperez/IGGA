# Render Blueprint for ERP-8AMPERIOS
# This file configures the services for deployment on Render

services:
  # Django Backend API
  - type: web
    name: erp-8amperios-backend
    runtime: python
    plan: starter
    buildCommand: |
      chmod +x build.sh && ./build.sh
    startCommand: gunicorn erp_core.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: erp-8amperios-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # React Frontend (Static Site)
  - type: static
    name: erp-8amperios-frontend
    runtime: node
    buildCommand: |
      cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_URL
        value: https://erp-backend-a37b.onrender.com/api
    routes:
      - type: rewrite
        source: /
        destination: /index.html
      - type: rewrite
        source: /(.*)
        destination: /index.html

databases:
  - name: erp-8amperios-db
    databaseName: erp_8amperios
    plan: starter
    ipAllowList: []
