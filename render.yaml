services:
  # Backend Service (Django)
  - type: web
    name: erp-8amperios-backend
    runtime: python
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn erp_core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-8amperios-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # Frontend Service (React Static Site)
  - type: static
    name: erp-8amperios-frontend
    runtime: node
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://erp-8amperios-backend.onrender.com/api"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

databases:
  - name: erp-8amperios-db
    plan: free